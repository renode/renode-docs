# Triggered only after MR is created/modified/closed and on master
.common_only: &common_only
  only:
    - master
    - merge_requests
    - schedules
    - triggers

stages:
  - build
  - deploy

image: $CI_DOCS_DOCKER_IMAGE


build-internal:
  stage: build
  <<: *common_only
  before_get_sources:
    - apt update > /dev/null && apt install -y wget > /dev/null
    - wget --progress=dot:giga  https://packages.microsoft.com/config/debian/13/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
    - dpkg -i packages-microsoft-prod.deb
    - apt update  > /dev/null && apt install -y git librsvg2-bin python3-venv python3-pip python3 cargo doxygen cmake build-essential dotnet-sdk-10.0  > /dev/null
    - wget -nv https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz -O - | tar -xJ --strip-components=1 -C /usr/local
  before_script:
    - python3 -m venv .venv/
    - source .venv/bin/activate
    - pip3 install -r requirements.txt
    - npm ci
    # checkout on the specified version if needed
    - |
      if [ -n "$TARGET_VERSION" ]; then
        echo -e "\n========== DOING CHECKOUT ON VERSION ============"
        echo "$TARGET_VERSION"
        git checkout "$TARGET_VERSION"
      fi
  script:
    - source .venv/bin/activate
    - make html
  artifacts:
    paths:
      - build/html
      - build/api-description

build-external:
  extends: build-internal
  variables:
    GITHUB_REF_NAME: $CI_COMMIT_REF_NAME
    GITHUB_SHA: $CI_COMMIT_SHA
  script:
    - source .venv/bin/activate
    # Avoid Gitlab-specific docs build due to logic in antmicro-sphinx-utils
    - unset CI_FULL_PROJECT_URL
    - make html

deploy-internal:
  variables:
    GIT_STRATEGY: none
  dependencies:
    - build-internal
  stage: deploy
  tags: ['docs']
  only:
    refs:
      - master
      - merge_requests
      - triggers
    variables:
      - $DEPLOY_DOCS == "true"
      - $CI_PIPELINE_SOURCE == "push"
      - $CI_PIPELINE_SOURCE == "merge_request"
  script:
    - tar cf $CI_DOCS_ARCHIVE -C build/html/ .
  artifacts:
    paths:
      - $CI_DOCS_ARCHIVE

deploy-external:
  dependencies:
    - build-external
  stage: deploy
  only:
    refs:
      - master
      - triggers
    variables:
      - $DEPLOY_DOCS == "true"
      - $CI_PIPELINE_SOURCE == "push"
  before_get_sources:
    - apt update  > /dev/null && apt install -y git python3-venv python3-pip python3 > /dev/null
  before_script:
    - python3 -m venv .venv/
    - source .venv/bin/activate
    - pip install readthedocs-upload
  script:
    - source .venv/bin/activate
    - readthedocs --verbose upload --project-slug renode --html build/html --version-type branch --version-name latest --privacy-level public
